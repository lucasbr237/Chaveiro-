name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar dependências
        run: npm install

      - name: Baixar fontes locais
        continue-on-error: true
        run: |
          mkdir -p www/assets/fonts
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          for W in 400 500 600 700; do
            CSS=$(curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Inter:wght@$W&display=swap")
            URL=$(echo "$CSS" | grep -oP "(?<=url\()[^)]+\.woff2(?=\))" | head -1)
            if [ -n "$URL" ]; then
              curl -sL "$URL" -o "www/assets/fonts/inter-$W.woff2"
              echo "OK inter-$W.woff2"
            else
              echo "FALHOU inter-$W (usará fallback de sistema)"
            fi
          done

          CSS=$(curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap")
          URL=$(echo "$CSS" | grep -oP "(?<=url\()[^)]+\.woff2(?=\))" | head -1)
          if [ -n "$URL" ]; then
            curl -sL "$URL" -o "www/assets/fonts/material-symbols-outlined.woff2"
            echo "OK material-symbols-outlined.woff2"
          else
            echo "FALHOU material symbols (ícones ficarão como texto)"
          fi

          ls -la www/assets/fonts/

      - name: Build CSS (Tailwind)
        run: npm run build:css

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: chaveiro-rapido-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
